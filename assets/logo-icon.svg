<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Pay-by-Play Icon">
  <defs>
    <clipPath id="squircle">
      <rect x="16" y="16" width="480" height="480" rx="64"/>
    </clipPath>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="#FAFAF9"/>

  <!-- Clipped Mondrian Grid Canvas -->
  <g clip-path="url(#squircle)">
    <!-- Blue Block (Pay / Stability) -->
    <rect x="16" y="16" width="194" height="280" fill="#0047AB"/>

    <!-- Red Block (Play / Athletic Action) -->
    <rect x="210" y="16" width="286" height="314" fill="#E60012"/>

    <!-- Play Symbol inside Red Block -->
    <!-- Centered optical play triangle (pointed right) -->
    <polygon points="315,100 315,246 430,173" fill="#FAFAF9" filter="url(#subtle-shadow)"/>
    <polygon points="315,100 315,246 430,173" fill="none" stroke="#0A0A0A" stroke-width="8" stroke-linejoin="round"/>

    <!-- Yellow Block (The Value Gap / Surplus / Bargain) -->
    <rect x="210" y="330" width="140" height="166" fill="#FFDD00"/>

    <!-- Deep Ink Block (Bottom-Right Anchor) -->
    <rect x="350" y="330" width="146" height="166" fill="#0A0A0A"/>

    <!-- Bottom-Left Light Block with Econometric Grid Accents -->
    <rect x="16" y="296" width="194" height="200" fill="#FAFAF9"/>
    <!-- Subtle horizontal bar lines evoking a salary ledger / data table -->
    <line x1="44" y1="345" x2="182" y2="345" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round"/>
    <line x1="44" y1="385" x2="150" y2="385" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round"/>
    <line x1="44" y1="425" x2="168" y2="425" stroke="#0A0A0A" stroke-width="6" stroke-linecap="round"/>

    <!-- Mondrian Master Structural Grid Lines (12px bold black lines) -->
    <!-- Main Vertical Spine -->
    <line x1="210" y1="16" x2="210" y2="496" stroke="#0A0A0A" stroke-width="12"/>
    <!-- Top-Left Horizontal Line -->
    <line x1="16" y1="296" x2="210" y2="296" stroke="#0A0A0A" stroke-width="12"/>
    <!-- Bottom-Right Horizontal Line -->
    <line x1="210" y1="330" x2="496" y2="330" stroke="#0A0A0A" stroke-width="12"/>
    <!-- Bottom-Right Sub-Vertical Line -->
    <line x1="350" y1="330" x2="350" y2="496" stroke="#0A0A0A" stroke-width="12"/>

    <!-- Sports Court / Rink Accent: Semi-circle crease cutting across the grid -->
    <path d="M 210,120 A 53 53 0 0 0 210,226" fill="none" stroke="#FAFAF9" stroke-width="6" stroke-dasharray="10 8"/>
  </g>

  <!-- Outer Structural Border -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="none" stroke="#0A0A0A" stroke-width="12"/>
</svg>