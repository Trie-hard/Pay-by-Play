<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Pay-by-Play Icon (Dark)">
  <defs>
    <clipPath id="squircle-dark">
      <rect x="16" y="16" width="480" height="480" rx="64"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="64" fill="#121212"/>

  <g clip-path="url(#squircle-dark)">
    <!-- Blue Block -->
    <rect x="16" y="16" width="194" height="280" fill="#4D88FF"/>

    <!-- Red Block -->
    <rect x="210" y="16" width="286" height="314" fill="#FF3333"/>

    <!-- Play Symbol -->
    <polygon points="315,100 315,246 430,173" fill="#F5F5F5" stroke="#121212" stroke-width="8" stroke-linejoin="round"/>

    <!-- Yellow Block -->
    <rect x="210" y="330" width="140" height="166" fill="#FFDD00"/>

    <!-- Dark Surface Block -->
    <rect x="350" y="330" width="146" height="166" fill="#1E1E22"/>

    <!-- Bottom-Left Charcoal Block -->
    <rect x="16" y="296" width="194" height="200" fill="#18181B"/>
    <line x1="44" y1="345" x2="182" y2="345" stroke="#F5F5F5" stroke-width="6" stroke-linecap="round"/>
    <line x1="44" y1="385" x2="150" y2="385" stroke="#F5F5F5" stroke-width="6" stroke-linecap="round"/>
    <line x1="44" y1="425" x2="168" y2="425" stroke="#F5F5F5" stroke-width="6" stroke-linecap="round"/>

    <!-- Grid Lines -->
    <line x1="210" y1="16" x2="210" y2="496" stroke="#121212" stroke-width="12"/>
    <line x1="16" y1="296" x2="210" y2="296" stroke="#121212" stroke-width="12"/>
    <line x1="210" y1="330" x2="496" y2="330" stroke="#121212" stroke-width="12"/>
    <line x1="350" y1="330" x2="350" y2="496" stroke="#121212" stroke-width="12"/>

    <!-- Arc -->
    <path d="M 210,120 A 53 53 0 0 0 210,226" fill="none" stroke="#F5F5F5" stroke-width="6" stroke-dasharray="10 8"/>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="64" fill="none" stroke="#F5F5F5" stroke-width="10"/>
</svg>