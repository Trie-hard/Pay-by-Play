[theme]
font = "sans-serif"
baseFontSize = 15
baseFontWeight = 500
baseRadius = "0rem"
buttonRadius = "0rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#E60012"
backgroundColor = "#FAFAF9"
secondaryBackgroundColor = "#F4F4F4"
textColor = "#0A0A0A"
borderColor = "#0A0A0A"
codeBackgroundColor = "#F4F4F4"
linkColor = "#0047AB"
chartCategoricalColors = ["#E60012", "#0047AB", "#FFDD00", "#0A0A0A", "#71717A", "#0047AB"]

[theme.dark]
primaryColor = "#FF3333"
backgroundColor = "#121212"
secondaryBackgroundColor = "#1E1E22"
textColor = "#F5F5F5"
borderColor = "#F5F5F5"
codeBackgroundColor = "#1A1A1A"
linkColor = "#4D88FF"
chartCategoricalColors = ["#FF3333", "#4D88FF", "#FFDD00", "#F5F5F5", "#A1A1AA", "#4D88FF"]
